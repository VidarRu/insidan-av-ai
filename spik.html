<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teknisk spik – Inuti språkmodellen</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  input[type=text] { width: 100%; font: inherit; padding: .5rem; box-sizing: border-box; }
  button { font: inherit; padding: .4rem .8rem; margin: .5rem .5rem .5rem 0; }
  .tok { display: inline-block; border: 1px solid #888; border-radius: 4px; padding: 0 .3rem; margin: 2px; font-family: ui-monospace, monospace; }
  table { border-collapse: collapse; } td, th { padding: .15rem .6rem; text-align: left; }
  .bar { display: inline-block; height: .8rem; background: #2563eb; vertical-align: middle; }
  #status { padding: .5rem; background: #eee; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Teknisk spik</h1>
<p>En testsida utan grafik. Den visar att GPT-SW3 126M räknar i webbläsaren.</p>
<p id="status" role="status">Startar…</p>
<label for="text">Början på en mening</label>
<input id="text" type="text" value="Biblioteket i Västervik ligger">
<button id="run">Räkna fram nästa bit</button>
<button id="gen">Fortsätt texten</button>
<label>Temperatur <input id="temp" type="number" min="0" max="2" step="0.1" value="0.8" style="width:4rem"></label>
<h2>Bitar (tokens)</h2>
<div id="tokens"></div>
<h2>De tio mest sannolika nästa bitarna</h2>
<table id="top"></table>
<h2>Fortsättning</h2>
<pre id="out"></pre>
<script type="module" src="/src/spik.js"></script>
</body>
</html>
